
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrinho | ASTRYX</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/storage.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/carrinho.js') }}" defer></script>
</head>

<body>

    <!-- MENU PRINCIPAL -->
    <header class="topo">

        <a class="logo" href="{{ url_for('inicio') }}">
            ASTRYX<span>◆</span>
        </a>

        <nav class="menu">
            <a href="{{ url_for('inicio') }}">Início</a>
            <a href="{{ url_for('produtos') }}">Produtos</a>
            <a href="{{ url_for('estoque') }}">Estoque</a>
            <a href="{{ url_for('carrinho') }}">Carrinho</a>
            <a href="{{ url_for('reservas') }}">Reservas</a>
            <a href="{{ url_for('pedidos') }}">Pedidos</a>
            <a href="{{ url_for('rastreamento') }}">Rastreamento</a>
        </nav>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="pagina">

        <div class="cabecalho-pagina">

            <p class="sobretitulo">
                ASTRYX • SUAS ESCOLHAS
            </p>

            <h1>Meu carrinho</h1>

            <p>
                Confira os itens selecionados antes de finalizar seu pedido.
            </p>

        </div>


        <!-- PAINEL DO CARRINHO -->
        <section class="painel">

            <!-- Produtos adicionados ao carrinho -->
            <div id="itens-carrinho"></div>


            <!-- TOTAL DA COMPRA -->
            <div class="total-linha">

                <strong>Total</strong>

                <strong id="total">
                    R$ 0,00
                </strong>

            </div>


            <!-- FINALIZAR PEDIDO -->
            <button id="finalizar" class="botao" type="button">
                Finalizar pedido
            </button>


            <!-- MENSAGEM DE RETORNO -->
            <p id="mensagem" class="mensagem"></p>

        </section>

    </main>


    <!-- RODAPÉ -->
    <footer>
        © <span id="ano"></span> ASTRYX — Jewelry & Technology.
    </footer>

</body>
</html>
