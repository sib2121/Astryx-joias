
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estoque | ASTRYX</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/storage.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/estoque.js') }}" defer></script>
</head>

<body>

    <!-- MENU PRINCIPAL -->
    <header class="topo">

        <a class="logo" href="{{ url_for('inicio') }}">
            ASTRYX<span>◆</span>
        </a>

        <nav class="menu">
            <a href="{{ url_for('inicio') }}">Início</a>
            <a href="{{ url_for('produtos') }}">Produtos</a>
            <a href="{{ url_for('estoque') }}">Estoque</a>
            <a href="{{ url_for('carrinho') }}">Carrinho</a>
            <a href="{{ url_for('reservas') }}">Reservas</a>
            <a href="{{ url_for('pedidos') }}">Pedidos</a>
            <a href="{{ url_for('rastreamento') }}">Rastreamento</a>
        </nav>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="pagina">

        <div class="cabecalho-pagina">

            <p class="sobretitulo">
                ASTRYX • ADMINISTRAÇÃO
            </p>

            <h1>Controle de estoque</h1>

            <p>
                Consulte e atualize as quantidades de produtos.
            </p>

        </div>


        <!-- CADASTRO DE NOVOS PRODUTOS -->
        <section class="painel">

            <h2>Adicionar novo produto</h2>

            <form id="form-produto" class="grade-form">

                <label>
                    Nome

                    <input
                        type="text"
                        id="nome"
                        required
                        placeholder="Nome do produto"
                    >
                </label>


                <label>
                    Categoria

                    <select id="categoria" required>
                        <option value="Anéis">Anéis</option>
                        <option value="Colares">Colares</option>
                        <option value="Pulseiras">Pulseiras</option>
                    </select>
                </label>


                <label>
                    Preço (R$)

                    <input
                        type="number"
                        id="preco"
                        min="0.01"
                        step="0.01"
                        required
                    >
                </label>


                <label>
                    Quantidade

                    <input
                        type="number"
                        id="quantidade"
                        min="0"
                        step="1"
                        required
                    >
                </label>


                <button class="botao" type="submit">
                    Adicionar produto
                </button>

            </form>

        </section>


        <!-- TABELA DE ESTOQUE -->
        <section class="painel">

            <h2>Produtos e quantidades</h2>

            <div id="tabela-estoque"></div>

            <p id="mensagem" class="mensagem"></p>

        </section>

    </main>


    <!-- RODAPÉ -->
    <footer>
        © <span id="ano"></span> ASTRYX — Jewelry & Technology.
    </footer>

</body>
</html>
