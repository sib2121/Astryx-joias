
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar | ASTRYX</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/storage.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/login.js') }}" defer></script>
</head>

<body>

    <!-- MENU PRINCIPAL -->
    <header class="topo">

        <a class="logo" href="{{ url_for('inicio') }}">
            ASTRYX<span>◆</span>
        </a>

        <nav class="menu">
            <a href="{{ url_for('inicio') }}">Início</a>
            <a href="{{ url_for('produtos') }}">Produtos</a>
            <a href="{{ url_for('estoque') }}">Estoque</a>
            <a href="{{ url_for('carrinho') }}">Carrinho</a>
            <a href="{{ url_for('reservas') }}">Reservas</a>
            <a href="{{ url_for('pedidos') }}">Pedidos</a>
            <a href="{{ url_for('rastreamento') }}">Rastreamento</a>
        </nav>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="pagina">

        <div class="cabecalho-pagina">

            <p class="sobretitulo">
                ASTRYX • JEWELRY & TECHNOLOGY
            </p>

            <h1>Entrar na ASTRYX</h1>

            <p>
                Acesse sua conta para continuar sua experiência.
            </p>

        </div>


        <!-- FORMULÁRIO DE LOGIN -->
        <section class="painel formulario">

            <form id="form-login">

                <label>
                    E-mail

                    <input
                        type="email"
                        id="email"
                        required
                        placeholder="voce@email.com"
                    >
                </label>


                <label>
                    Senha

                    <input
                        type="password"
                        id="senha"
                        required
                        placeholder="Sua senha"
                    >
                </label>


                <button class="botao" type="submit">
                    Entrar
                </button>


                <p id="mensagem" class="mensagem"></p>


                <p class="texto-centro">
                    Ainda não tem conta?

                    <a href="{{ url_for('cadastro') }}">
                        Cadastre-se
                    </a>.
                </p>

            </form>

        </section>

    </main>


    <!-- RODAPÉ -->
    <footer>
        © <span id="ano"></span> ASTRYX — Jewelry & Technology.
    </footer>

</body>
</html>
