
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reservas | ASTRYX</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/storage.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/reservas.js') }}" defer></script>
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="topo">

        <a class="logo" href="{{ url_for('inicio') }}">
            ASTRYX<span>◆</span>
        </a>

        <!-- MENU DE NAVEGAÇÃO -->
        <nav class="menu">
            <a href="{{ url_for('inicio') }}">Início</a>
            <a href="{{ url_for('produtos') }}">Produtos</a>
            <a href="{{ url_for('estoque') }}">Estoque</a>
            <a href="{{ url_for('carrinho') }}">Carrinho</a>
            <a href="{{ url_for('reservas') }}">Reservas</a>
            <a href="{{ url_for('pedidos') }}">Pedidos</a>
            <a href="{{ url_for('rastreamento') }}">Rastreamento</a>
        </nav>

    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="pagina">

        <div class="cabecalho-pagina">
            <p class="sobretitulo">ASTRYX • RESERVAS</p>

            <h1>Reservar uma joia</h1>

            <p>
                Reserve um produto para consultar posteriormente.
            </p>
        </div>

        <!-- FORMULÁRIO DE RESERVA -->
        <section class="painel formulario">

            <form id="form-reserva">

                <label>
                    Produto

                    <select id="produto" required></select>
                </label>

                <label>
                    Data desejada

                    <input
                        id="data"
                        type="date"
                        required
                    >
                </label>

                <label>
                    Observações

                    <textarea
                        id="observacoes"
                        rows="3"
                        placeholder="Detalhes opcionais"
                    ></textarea>
                </label>

                <button class="botao" type="submit">
                    Solicitar reserva
                </button>

                <p id="mensagem" class="mensagem"></p>

            </form>

        </section>

        <!-- LISTA DE RESERVAS -->
        <section class="painel">

            <h2>Minhas reservas</h2>

            <div id="lista-reservas"></div>

        </section>

    </main>

    <!-- RODAPÉ -->
    <footer>
        © <span id="ano"></span> ASTRYX — Jewelry & Technology.
    </footer>

</body>

</html>
