
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta | ASTRYX</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/storage.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/cadastro.js') }}" defer></script>
</head>

<body>

    <!-- MENU PRINCIPAL -->
    <header class="topo">

        <a class="logo" href="{{ url_for('inicio') }}">
            ASTRYX<span>◆</span>
        </a>

        <nav class="menu">
            <a href="{{ url_for('inicio') }}">Início</a>
            <a href="{{ url_for('produtos') }}">Produtos</a>
            <a href="{{ url_for('estoque') }}">Estoque</a>
            <a href="{{ url_for('carrinho') }}">Carrinho</a>
            <a href="{{ url_for('reservas') }}">Reservas</a>
            <a href="{{ url_for('pedidos') }}">Pedidos</a>
            <a href="{{ url_for('rastreamento') }}">Rastreamento</a>
        </nav>

        <div class="conta">
            <a href="{{ url_for('login') }}">Entrar</a>
        </div>

    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="pagina">

        <div class="cabecalho-pagina">

            <p class="sobretitulo">
                ASTRYX • JEWELRY & TECHNOLOGY
            </p>

            <h1>Criar conta</h1>

            <p>
                Faça seu cadastro para acompanhar suas compras e reservas.
            </p>

        </div>


        <!-- FORMULÁRIO DE CADASTRO -->
        <section class="painel formulario">

            <form id="form-cadastro">

                <label>
                    Nome completo

                    <input
                        type="text"
                        id="nome"
                        required
                        minlength="3"
                        placeholder="Seu nome"
                    >
                </label>


                <label>
                    E-mail

                    <input
                        type="email"
                        id="email"
                        required
                        placeholder="voce@email.com"
                    >
                </label>


                <label>
                    Senha

                    <input
                        type="password"
                        id="senha"
                        required
                        minlength="6"
                        placeholder="Mínimo de 6 caracteres"
                    >
                </label>


                <label>
                    Confirmar senha

                    <input
                        type="password"
                        id="confirmar-senha"
                        required
                        placeholder="Digite a senha novamente"
                    >
                </label>


                <button class="botao" type="submit">
                    Cadastrar
                </button>


                <p id="mensagem" class="mensagem"></p>


                <p class="texto-centro">
                    Já tem uma conta?

                    <a href="{{ url_for('login') }}">
                        Faça login
                    </a>.
                </p>

            </form>

        </section>

    </main>


    <!-- RODAPÉ -->
    <footer>
        © <span id="ano"></span> ASTRYX — Jewelry & Technology.
    </footer>

</body>
</html>
