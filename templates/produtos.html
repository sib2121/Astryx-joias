
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Produtos | ASTRYX</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/storage.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/produtos.js') }}" defer></script>
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="topo">

        <a class="logo" href="{{ url_for('inicio') }}">
            ASTRYX<span>◆</span>
        </a>

        <!-- MENU DE NAVEGAÇÃO -->
        <nav class="menu">
            <a href="{{ url_for('inicio') }}">Início</a>
            <a href="{{ url_for('produtos') }}">Produtos</a>
            <a href="{{ url_for('estoque') }}">Estoque</a>
            <a href="{{ url_for('carrinho') }}">Carrinho</a>
            <a href="{{ url_for('reservas') }}">Reservas</a>
            <a href="{{ url_for('pedidos') }}">Pedidos</a>
            <a href="{{ url_for('rastreamento') }}">Rastreamento</a>
        </nav>

    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="pagina">

        <div class="cabecalho-pagina">
            <p class="sobretitulo">ASTRYX • COLEÇÃO</p>

            <h1>Nossa coleção</h1>

            <p>
                Explore as peças disponíveis na coleção ASTRYX.
            </p>
        </div>

        <!-- PESQUISA E FILTRO DE PRODUTOS -->
        <section class="barra-acoes">

            <input
                id="busca"
                type="search"
                placeholder="Buscar produto..."
            >

            <select id="filtro">
                <option value="todos">Todas as categorias</option>
                <option value="Anéis">Anéis</option>
                <option value="Colares">Colares</option>
                <option value="Pulseiras">Pulseiras</option>
            </select>

        </section>

        <!-- LISTA DE PRODUTOS CARREGADA PELO JAVASCRIPT -->
        <section id="lista-produtos" class="cards produtos-grid"></section>

        <!-- MENSAGEM DE RETORNO -->
        <p id="mensagem" class="mensagem"></p>

    </main>

    <!-- RODAPÉ -->
    <footer>
        © <span id="ano"></span> ASTRYX — Jewelry & Technology.
    </footer>

</body>

</html>
