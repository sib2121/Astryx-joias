<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | ASTRYX</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/storage.js" defer></script>
    <script src="js/login.js" defer></script>
</head>

<body>

    <header class="topo">
        <a class="logo" href="index.html">ASTRYX<span>◆</span></a>

        <nav class="menu">
            <a href="index.html">Início</a>
            <a href="produtos.html">Produtos</a>
            <a href="estoque.html">Estoque</a>
            <a href="carrinho.html">Carrinho</a>
            <a href="reservas.html">Reservas</a>
            <a href="pedidos.html">Pedidos</a>
            <a href="rastreamento.html">Rastreamento</a>
        </nav>
    </header>

    <main class="pagina">

        <div class="cabecalho-pagina">
            <p class="sobretitulo">ASTRYX • JEWELRY & TECHNOLOGY</p>
            <h1>Entrar na ASTRYX</h1>
            <p>Acesse sua conta para continuar sua experiência.</p>
        </div>

        <!-- Formulário de login -->
        <section class="painel formulario">

            <form id="form-login">

                <label>
                    E-mail
                    <input
                        type="email"
                        id="email"
                        required
                        placeholder="voce@email.com"
                    >
                </label>

                <label>
                    Senha
                    <input
                        type="password"
                        id="senha"
                        required
                        placeholder="Sua senha"
                    >
                </label>

                <button class="botao" type="submit">
                    Entrar
                </button>

                <p id="mensagem" class="mensagem"></p>

                <p class="texto-centro">
                    Ainda não tem conta?
                    <a href="cadastro.html">Cadastre-se</a>.
                </p>

            </form>

        </section>

    </main>

    <footer>
        © <span id="ano"></span> ASTRYX — Jewelry & Technology.
    </footer>

</body>
</html>
