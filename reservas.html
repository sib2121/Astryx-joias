<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas | ASTRYX</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/storage.js" defer></script>
    <script src="js/reservas.js" defer></script>
</head>

<body>

    <header class="topo">
        <a class="logo" href="index.html">ASTRYX<span>◆</span></a>

        <nav class="menu">
            <a href="index.html">Início</a>
            <a href="produtos.html">Produtos</a>
            <a href="estoque.html">Estoque</a>
            <a href="carrinho.html">Carrinho</a>
            <a href="reservas.html">Reservas</a>
            <a href="pedidos.html">Pedidos</a>
            <a href="rastreamento.html">Rastreamento</a>
        </nav>
    </header>

    <main class="pagina">

        <div class="cabecalho-pagina">
            <p class="sobretitulo">ASTRYX • RESERVAS</p>
            <h1>Reservar uma joia</h1>
            <p>Reserve um produto para consultar posteriormente.</p>
        </div>

        <section class="painel formulario">

            <form id="form-reserva">

                <label>
                    Produto
                    <select id="produto" required></select>
                </label>

                <label>
                    Data desejada
                    <input id="data" type="date" required>
                </label>

                <label>
                    Observações
                    <textarea id="observacoes" rows="3" placeholder="Detalhes opcionais"></textarea>
                </label>

                <button class="botao" type="submit">
                    Solicitar reserva
                </button>

                <p id="mensagem" class="mensagem"></p>

            </form>

        </section>

        <section class="painel">
            <h2>Minhas reservas</h2>
            <div id="lista-reservas"></div>
        </section>

    </main>

    <footer>
        © <span id="ano"></span> ASTRYX — Jewelry & Technology.
    </footer>

</body>
</html>
