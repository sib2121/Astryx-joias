<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta | ASTRYX</title>

    <link rel="stylesheet" href="css/style.css">

    <script src="js/storage.js" defer></script>
    <script src="js/cadastro.js" defer></script>
</head>

<body>

    <!-- Menu principal -->
    <header class="topo">
        <a class="logo" href="index.html">ASTRYX<span>◆</span></a>

        <nav class="menu">
            <a href="index.html">Início</a>
            <a href="produtos.html">Produtos</a>
            <a href="estoque.html">Estoque</a>
            <a href="carrinho.html">Carrinho</a>
            <a href="reservas.html">Reservas</a>
            <a href="pedidos.html">Pedidos</a>
            <a href="rastreamento.html">Rastreamento</a>
        </nav>

        <div class="conta">
            <a href="login.html">Entrar</a>
        </div>
    </header>

    <main class="pagina">

        <div class="cabecalho-pagina">
            <p class="sobretitulo">ASTRYX • JEWELRY & TECHNOLOGY</p>
            <h1>Criar conta</h1>
            <p>Faça seu cadastro para acompanhar suas compras e reservas.</p>
        </div>

        <!-- Formulário de cadastro -->
        <section class="painel formulario">

            <form id="form-cadastro">

                <label>
                    Nome completo
                    <input
                        type="text"
                        id="nome"
                        required
                        minlength="3"
                        placeholder="Seu nome"
                    >
                </label>

                <label>
                    E-mail
                    <input
                        type="email"
                        id="email"
                        required
                        placeholder="voce@email.com"
                    >
                </label>

                <label>
                    Senha
                    <input
                        type="password"
                        id="senha"
                        required
                        minlength="6"
                        placeholder="Mínimo de 6 caracteres"
                    >
                </label>

                <label>
                    Confirmar senha
                    <input
                        type="password"
                        id="confirmar-senha"
                        required
                        placeholder="Digite a senha novamente"
                    >
                </label>

                <button class="botao" type="submit">
                    Cadastrar
                </button>

                <p id="mensagem" class="mensagem"></p>

                <p class="texto-centro">
                    Já tem uma conta?
                    <a href="login.html">Faça login</a>.
                </p>

            </form>

        </section>

    </main>

    <footer>
        © <span id="ano"></span> ASTRYX — Jewelry & Technology.
    </footer>

</body>
</html>
